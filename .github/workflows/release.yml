name: Release

# A maintainer pushes vX.Y.Z or vX.Y.Z-prerelease after merging the version bump.
# Validate the tag, then run the existing CI suite on this same commit before
# publishing. Prereleases get versioned images only; stable releases also update
# Docker's latest tag. See docs/en/releases.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: garybowers/bootimus

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and VERSION
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          metadata="$(scripts/release-metadata.sh "$version")"
          if [ "$version" != "$(cat VERSION)" ]; then
            echo 'Tag and VERSION differ. Run make bump and tag the merged version bump.' >&2
            exit 1
          fi
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: prepare
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Build & attach binaries
    needs: [prepare, checks]
    permissions:
      contents: write # create/attach GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: make binaries

      - name: Generate checksums
        run: sha256sum bootimus-* > SHA256SUMS

      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.latest }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            bootimus-*
            SHA256SUMS

  docker:
    name: Build & push container image
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync embedded profile versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: make sync-profiles

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
