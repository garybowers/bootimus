name: CI

# Runs once per change: pull requests test the result of merging into the
# target branch; pushes to main verify the merge itself (and build the
# container image). Branches without an open PR don't run CI. Tag pushes are
# handled by release.yml, which calls this workflow before publishing.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Install WIM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wimtools

      - name: Test
        run: go test ./...

      - name: Integration test (throwaway OIDC provider)
        run: make test-integration

      - name: Build
        run: make build

  e2e:
    name: PXE boot in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install QEMU, OVMF and bsdtar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf iproute2 libcap2-bin libarchive-tools

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Cache Alpine netboot files
        uses: actions/cache@v4
        with:
          path: ~/.cache/bootimus-e2e
          key: bootimus-e2e-alpine-${{ hashFiles('e2e/alpine_test.go') }}

      - name: Build the binary under test
        run: make e2e-binary

      - name: Allow the binary to bind the TFTP and DHCP ports
        run: sudo setcap cap_net_bind_service=+ep .e2e/bootimus

      - name: Boot virtual machines against it over a bridge
        env:
          BOOTIMUS_E2E_BINARY: ${{ github.workspace }}/.e2e/bootimus
          BOOTIMUS_E2E_REQUIRE_BRIDGE: "1"
        run: make test-e2e

      - name: Upload boot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-logs
          path: .e2e/run
          if-no-files-found: ignore

  postgres:
    name: Storage & backup on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bootimus
          POSTGRES_PASSWORD: bootimus
          POSTGRES_DB: bootimus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bootimus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version

      - name: Test against PostgreSQL
        env:
          BOOTIMUS_TEST_POSTGRES_DSN: postgres://bootimus:bootimus@localhost:5432/bootimus?sslmode=disable
        run: go test -count=1 -p 1 ./internal/storage/ ./internal/server/ ./internal/admin/

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive snapshot version
        id: version
        run: echo "version=$(cat VERSION)-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ui:
    name: UI smoke in Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install the test runner
        working-directory: ui-tests
        run: npm ci

      - name: Install Chromium
        working-directory: ui-tests
        run: npx playwright install --with-deps chromium

      - name: Run the UI smoke tests
        run: make test-ui

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-report
          path: |
            ui-tests/playwright-report
            ui-tests/test-results
          if-no-files-found: ignore
